<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <defs>
    <!-- Moonlight Glow on Hill -->
    <radialGradient id="hillGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3c4765" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#151216" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040D18" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Subtle Silver Rim Highlight for Girl -->
    <linearGradient id="girlHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8d6ed" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#6575a4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d0e15" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Silver Rim Highlight for Boy -->
    <linearGradient id="boyHighlight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8d6ed" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#6575a4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d0e15" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Starlight twinkle filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Distant Hill Horizon -->
  <path d="M 0 220 Q 160 120 320 220 L 320 220 L 0 220 Z" fill="url(#hillGlow)" />
  <path d="M 0 220 Q 160 128 320 220" stroke="#6575a4" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Tiny floating fireflies / stars around the couple -->
  <circle cx="115" cy="115" r="1.2" fill="#e2e8f0" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="205" cy="110" r="1.5" fill="#e2e8f0" opacity="0.9" filter="url(#softGlow)"/>
  <circle cx="160" cy="85" r="1" fill="#c8d6ed" opacity="0.7"/>
  <circle cx="128" cy="80" r="1.2" fill="#fff" opacity="0.85" filter="url(#softGlow)"/>
  <circle cx="192" cy="78" r="1" fill="#fff" opacity="0.6"/>

  <!-- COUPLE SILHOUETTE (Sitting close together, looking out at the sky) -->
  <!-- BOY: Left figure (Clean tapered short hair, broader shoulders, casual leaning posture) -->
  <g class="silhouette-boy">
    <!-- Boy Body / Torso & Jacket -->
    <path d="M 112 165 C 114 146 122 136 132 134 C 137 133 147 134 153 140 C 158 145 158 155 157 165 Z" fill="#08090f" />
    <!-- Boy Moonlight edge stroke -->
    <path d="M 112 165 C 114 146 122 136 132 134 C 136 133 140 134 144 135" stroke="url(#boyHighlight)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    
    <!-- Boy Neck -->
    <path d="M 134 134 L 134 126 C 137 127 141 127 144 126 L 144 134 Z" fill="#08090f" />
    
    <!-- Boy Head & Short Haircut Silhouette -->
    <!-- Distinct short male haircut with slight texture/fringe on top and trimmed neckline -->
    <path d="M 132 126 C 128 122 127 114 129 108 C 130 103 134 98 141 97 C 147 96 153 100 154 107 C 155 113 152 121 146 126 C 142 127 136 127 132 126 Z" fill="#08090f" />
    <!-- Boy Hair Tufts / Clean Short Hairstyle Shape -->
    <path d="M 131 112 C 128 107 131 100 137 97 C 142 95 149 96 153 101 C 156 105 155 111 153 115 C 150 114 148 111 145 112 C 140 113 136 116 131 112 Z" fill="#06070c" />
    <!-- Boy Moonlit Rim Light on Hair & Shoulder -->
    <path d="M 129 113 C 128 106 131 100 138 97 C 144 95 151 98 153 102" stroke="#c8d6ed" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9" />
  </g>

  <!-- GIRL: Right figure (Soft graceful head tilt leaning towards boy, beautiful long flowing hair draping down her back & shoulder, gentle feminine frame) -->
  <g class="silhouette-girl">
    <!-- Girl Long Hair (Back layer draping over shoulders down past back) -->
    <path d="M 166 106 C 163 112 161 122 160 135 C 159 146 160 156 162 165 C 166 165 174 165 176 158 C 178 148 180 138 182 128 C 183 120 180 112 176 106 Z" fill="#05060a" />

    <!-- Girl Body / Torso (Delicate frame, soft posture leaning slightly toward him) -->
    <path d="M 152 142 C 158 136 168 135 176 137 C 185 139 194 148 196 165 C 178 167 162 167 152 165 Z" fill="#08090f" />
    
    <!-- Girl Moonlight Rim Light on Right Shoulder -->
    <path d="M 176 137 C 185 139 194 148 196 165" stroke="url(#girlHighlight)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Girl Head (Tilted tenderly towards the boy) -->
    <path d="M 160 120 C 157 115 157 106 161 101 C 165 96 172 95 177 98 C 182 101 184 108 183 115 C 181 122 176 125 170 124 C 165 123 162 122 160 120 Z" fill="#08090f" />

    <!-- Girl Flowing Long Hair Contour & Waves (Distinct feminine hairstyle draping down her right side & back) -->
    <path d="M 167 96 C 174 95 181 98 184 104 C 188 111 189 120 188 128 C 187 136 189 144 191 152 C 192 155 190 158 187 157 C 184 152 183 143 182 135 C 181 125 183 118 181 112 C 179 105 175 101 169 98 C 165 98 163 100 162 103 C 161 101 163 97 167 96 Z" fill="#040508" />

    <!-- Delicate Hair Tendril / Soft Waves Glow on Girl's Hair -->
    <path d="M 170 96 C 177 96 183 100 186 107 C 188 115 188 125 187 134 C 186 142 188 150 190 156" stroke="#c8d6ed" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Cute detail: small bow or clip starlight shimmer in girl's hair -->
    <circle cx="182" cy="108" r="1" fill="#fff" opacity="0.9" filter="url(#softGlow)" />
  </g>

  <!-- Tender Connection: Sitting close, their hands touching in the middle -->
  <ellipse cx="155" cy="158" rx="6" ry="4" fill="#08090f" />
  <path d="M 151 157 C 154 155 157 155 160 157" stroke="#6575a4" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Romantic Atmosphere: subtle ambient light beneath them on grass -->
  <ellipse cx="154" cy="167" rx="46" ry="6" fill="#6575a4" fill-opacity="0.12" />
</svg>